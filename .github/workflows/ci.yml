name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, tests, build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Run all checks
        run: npm run check

  browser:
    name: Browser tests (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium

      - name: Build the production app
        run: npm run build

      - name: Run browser tests
        run: npm run test:e2e
