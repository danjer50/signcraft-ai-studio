# Cloudflare Pages project configuration (Milestone 5).
#
# `next build` writes the fully static site to `out/` (`output: "export"` in
# next.config.ts). The dynamic part — the auth API — runs as Pages Functions from
# `functions/`, which Pages serves for the paths listed in `public/_routes.json`.
#
# `database_id` is a PLACEHOLDER. Before deploying, create the database and paste the
# real id:
#   npx wrangler d1 create signcraft-ai-studio
# Local development and tests never use it: `npm run test:server` applies
# functions/schema.sql to wrangler's local D1 state.
name = "signcraft-ai-studio"
compatibility_date = "2026-10-01"
pages_build_output_dir = "out"

[[d1_databases]]
binding = "DB"
database_name = "signcraft-ai-studio"
database_id = "00000000-0000-0000-0000-000000000000"

# Secrets (SETUP_SECRET, PASSWORD_PEPPER) are set per environment with
# `wrangler pages secret put <NAME>` and are never committed. Local tests get
# deterministic TEST-ONLY values from the gitignored `.dev.vars` written by
# scripts/test-env.mjs.
#
# Preview deployments get their own database and their own secrets, so a preview
# can never touch production accounts:
# [env.preview]
# [[env.preview.d1_databases]]
# binding = "DB"
# database_name = "signcraft-ai-studio-preview"
# database_id = "<preview database id>"
